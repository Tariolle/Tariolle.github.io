---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="site-shell{% if page.url == '/' or page.url == '/index.html' %} page--home{% endif %}">

    <canvas class="latent-space" data-latent-space aria-hidden="true"></canvas>
    <div class="latent-space__veil" aria-hidden="true"></div>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
